version: "3.8"

# ============================================
# SERVICES
# ============================================
services:
  # --------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: leynai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leynai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leynai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-leynai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - leynai-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-leynai} -d ${POSTGRES_DB:-leynai_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------
  # Redis Queue
  # --------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: leynai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - leynai-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------
  # MinIO Object Storage (S3-compatible)
  # --------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: leynai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000" # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Console Web
    networks:
      - leynai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # --------------------------------------------
  # MinIO Client - Create bucket on startup
  # --------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: leynai-minio-init
    depends_on:
      - minio
    networks:
      - leynai-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set leynai http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb leynai/screenshots --ignore-existing;
      mc anonymous set download leynai/screenshots;
      echo 'MinIO bucket created successfully';
      exit 0;
      "

  # --------------------------------------------
  # Backend API (Node.js + TypeScript + Playwright)
  # --------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: leynai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Node
      NODE_ENV: production
      PORT: 4000

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-leynai}:${POSTGRES_PASSWORD:-leynai_secret}@postgres:5432/${POSTGRES_DB:-leynai_db}?schema=public

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}

      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: screenshots
      S3_REGION: us-east-1
      S3_USE_SSL: "false"

      # Public URL for screenshots (accessible from browser)
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}

      # OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Authentication
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}

      # Playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    volumes:
      - backend_screenshots:/app/screenshots
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - leynai-network

  # --------------------------------------------
  # Frontend (Next.js)
  # --------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: leynai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_MINIO_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - leynai-network

# ============================================
# NETWORKS
# ============================================
networks:
  leynai-network:
    driver: bridge

# ============================================
# VOLUMES (Persistent Data)
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_screenshots:
    driver: local
